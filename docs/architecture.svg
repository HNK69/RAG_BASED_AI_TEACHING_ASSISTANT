<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RAG-based teaching assistant architecture</title>
  <desc id="desc">A diagram showing videos converted to audio, transcribed by Whisper, embedded by Ollama, retrieved by cosine similarity, and answered by a language model.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <rect width="1200" height="92" fill="url(#header)"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">RAG-Based AI Teaching Assistant</text>
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">Local video retrieval, timestamped context, and grounded answers</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="60" y="160" width="210" height="112" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Course videos</text>
    <text x="165" y="222" text-anchor="middle" font-size="15" fill="#1e40af">videos/.mp4</text>
    <text x="165" y="247" text-anchor="middle" font-size="13" fill="#334155">Input lessons</text>
    <rect x="340" y="160" width="210" height="112" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="445" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">Whisper</text>
    <text x="445" y="222" text-anchor="middle" font-size="15" fill="#166534">create_chunks.py</text>
    <text x="445" y="247" text-anchor="middle" font-size="13" fill="#334155">Transcript + timestamps</text>
    <rect x="620" y="160" width="210" height="112" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="725" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">Embedding index</text>
    <text x="725" y="222" text-anchor="middle" font-size="15" fill="#92400e">read_chunks.py</text>
    <text x="725" y="247" text-anchor="middle" font-size="13" fill="#334155">Ollama bge-m3</text>
    <rect x="900" y="160" width="240" height="112" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
    <text x="1020" y="194" text-anchor="middle" font-size="19" font-weight="700" fill="#9d174d">embeddings.joblib</text>
    <text x="1020" y="222" text-anchor="middle" font-size="15" fill="#9d174d">Searchable chunks</text>
    <text x="1020" y="247" text-anchor="middle" font-size="13" fill="#334155">Vectors + metadata</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M270 216 H340"/>
    <path d="M550 216 H620"/>
    <path d="M830 216 H900"/>
  </g>
  <text x="305" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">ffmpeg</text>
  <text x="585" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">JSON chunks</text>
  <text x="865" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">joblib</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="170" y="400" width="230" height="112" rx="14" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text x="285" y="434" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">User question</text>
    <text x="285" y="462" text-anchor="middle" font-size="15" fill="#4338ca">process_incoming.py</text>
    <text x="285" y="487" text-anchor="middle" font-size="13" fill="#334155">Question embedding</text>
    <rect x="485" y="400" width="230" height="112" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="600" y="434" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">Retriever</text>
    <text x="600" y="462" text-anchor="middle" font-size="15" fill="#7c3aed">Cosine similarity</text>
    <text x="600" y="487" text-anchor="middle" font-size="13" fill="#334155">Top 8 chunks</text>
    <rect x="800" y="400" width="230" height="112" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="915" y="434" text-anchor="middle" font-size="19" font-weight="700" fill="#991b1b">Answer</text>
    <text x="915" y="462" text-anchor="middle" font-size="15" fill="#b91c1c">Ollama qwen3</text>
    <text x="915" y="487" text-anchor="middle" font-size="13" fill="#334155">response.txt + timestamps</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M400 456 H485"/>
    <path d="M715 456 H800"/>
    <path d="M1020 272 V350 H600 V400"/>
  </g>
  <text x="758" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">retrieved context</text>
</svg>
